name: SmartStock
options:
  bundleIdPrefix: com.samvel.smartstock
targets:
  SmartStock:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: SmartStock
        CFBundleDisplayName: SmartStock
        CFBundleIdentifier: com.samvel.smartstock.SmartStock
        CFBundleVersion: "8"
        CFBundleShortVersionString: "1.7"
        CFBundlePackageType: APPL
        CFBundleExecutable: SmartStock
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Приложению нужен доступ к вашей галерее для выбора фотографий на отправку."
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            CFBundleIconName: AppIcon
    settings:
      base:
        SWIFT_VERSION: "5.9"
        ALWAYS_SEARCH_USER_PATHS: "NO"
        PRODUCT_NAME: SmartStock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_PRIMARY_APPICON_SET_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Sources/SmartStock.entitlements
        SKIP_INSTALL: "NO"
        INSTALL_PATH: "/Applications"
