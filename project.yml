name: SmartStock
options:
  bundleIdPrefix: com.samvel.smartstock
targets:
  SmartStock:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    entitlements: Sources/SmartStock.entitlements
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: SmartStock
        CFBundleDisplayName: SmartStock
        CFBundleIdentifier: com.samvel.smartstock.SmartStock
        CFBundleVersion: "7"
        CFBundleShortVersionString: "1.6"
        CFBundlePackageType: APPL
        CFBundleExecutable: SmartStock
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Приложению нужен доступ к вашей галерее для выбора фотографий на отправку."
        CFBundleIconName: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            CFBundleIconName: AppIcon
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: SmartStock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_PRIMARY_APPICON_SET_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
