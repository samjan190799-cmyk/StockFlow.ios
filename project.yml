name: SmartStock
options:
  bundleIdPrefix: com.samvel.smartstock
targets:
  SmartStock:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: SmartStock
        CFBundleDisplayName: SmartStock
        CFBundleIdentifier: com.samvel.smartstock.SmartStock
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: SmartStock
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Приложению нужен доступ к вашей галерее для выбора фотографий на отправку."
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: SmartStock
        ASSETCATALOG_COMPILER_PRIMARY_APPICON_SET_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
