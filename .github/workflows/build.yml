name: Build SmartStock iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SmartStock iOS Application
    runs-on: macos-15

    env:
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' && 'true' || 'false' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        id: cache-homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
            /opt/homebrew/bin/xcodegen
          key: ${{ runner.os }}-homebrew-xcodegen

      - name: Install XcodeGen
        if: steps.cache-homebrew.outputs.cache-hit != 'true'
        run: |
          brew update
          brew install xcodegen

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Import Code Signing Certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROFILE_B64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          python3 -c "
          import os, base64, re
          raw_b64 = os.environ.get('PROFILE_B64', '')
          b64 = re.sub(r'[^A-Za-z0-9+/=]', '', raw_b64)
          if not b64:
              raise ValueError('BUILD_PROVISION_PROFILE_BASE64 is empty!')
          b64 += '=' * ((4 - len(b64) % 4) % 4)
          data = base64.b64decode(b64)
          dest = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision')
          os.makedirs(os.path.dirname(dest), exist_ok=True)
          with open(dest, 'wb') as f:
              f.write(data)
          print('Installed provisioning profile, size:', len(data), 'bytes')
          "
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Diagnose Signing Environment
        run: |
          echo "=== Installed Profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "No profiles"

          echo "=== Profile UUID and Name ==="
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision" 2>/dev/null \
            | grep -E "(UUID|Name|TeamIdentifier|ExpirationDate|application-identifier)" \
            | head -20 || echo "Could not read profile"

          echo "=== All code signing identities ==="
          security find-identity -v -p codesigning 2>/dev/null || echo "No certificates found"

          echo "=== Raw certificate names ==="
          security find-identity -v 2>/dev/null | grep -E "(Apple|iPhone|iOS|Distribution)" | head -10 || echo "None"

      - name: Archive App
        shell: bash
        run: |
          set +e  # отключаем exit-on-error чтобы диагностика выводилась всегда
          echo "=== Starting xcodebuild archive ==="

          # Точное имя сертификата из keychain
          CERT_NAME=$(security find-identity -v -p codesigning 2>/dev/null \
            | grep -E "(Apple Distribution|iPhone Distribution)" \
            | head -1 | sed 's/.*"\(.*\)".*/\1/')
          [ -z "$CERT_NAME" ] && CERT_NAME="Apple Distribution"
          echo "Using certificate: $CERT_NAME"

          xcodebuild archive \
            -project SmartStock.xcodeproj \
            -scheme SmartStock \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/SmartStock.xcarchive \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="$CERT_NAME" \
            PROVISIONING_PROFILE_SPECIFIER="SmartStock AppStore" \
            DEVELOPMENT_TEAM="V7J345DY58" \
            CODE_SIGNING_REQUIRED="YES" \
            CODE_SIGNING_ALLOWED="YES" \
            SWIFT_OPTIMIZATION_LEVEL="-O" \
            SKIP_INSTALL="NO" \
            INSTALL_PATH="/Applications"
          ARCHIVE_EXIT=$?

          echo "=== Archive exit code: $ARCHIVE_EXIT ==="
          echo "=== Build dir ==="
          ls -la build/ 2>/dev/null || echo "No build dir"
          ls -la build/SmartStock.xcarchive/Products/Applications/ 2>/dev/null || echo "No xcarchive"

          exit $ARCHIVE_EXIT

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/SmartStock.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            2>&1 || { echo "Export failed!"; exit 1; }

          echo "Export directory:"
          ls -la build/export/
          IPA_PATH=$(find build/export -name "*.ipa" | head -1)
          echo "IPA found: $IPA_PATH"
          cp "$IPA_PATH" build/SmartStock.ipa
          echo "IPA size: $(du -h build/SmartStock.ipa | cut -f1)"

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartStock-IPA
          path: build/SmartStock.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "SmartStock v1.6 (Build ${{ github.run_number }})"
          body: |
            ## SmartStock iOS IPA
            SmartStock v1.6 Release
          files: build/SmartStock.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to TestFlight
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$PRIVATE_KEY" > ~/.private_keys/AuthKey_${KEY_ID}.p8

          echo "Uploading App to TestFlight via xcrun altool..."
          xcrun altool --upload-app \
            -f build/SmartStock.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose
