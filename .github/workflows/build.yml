name: Build SmartStock iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SmartStock iOS Application
    runs-on: macos-14

    env:
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' && 'true' || 'false' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        id: cache-homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
            /opt/homebrew/bin/xcodegen
          key: ${{ runner.os }}-homebrew-xcodegen

      - name: Install XcodeGen
        if: steps.cache-homebrew.outputs.cache-hit != 'true'
        run: |
          brew update
          brew install xcodegen

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Import Code Signing Certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROFILE_B64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROFILE_B64" | openssl base64 -d -A > "$PROFILES_DIR/appstore.mobileprovision"
          ls -la "$PROFILES_DIR"

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build for iOS Device (signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project SmartStock.xcodeproj \
            -scheme SmartStock \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="SmartStock AppStore" \
            SWIFT_OPTIMIZATION_LEVEL="-O" \
            build 2>&1 | xcpretty

          ls -l build/Build/Products/Release-iphoneos/SmartStock.app/SmartStock

      - name: Package as IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          echo "App path: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/SmartStock.app
          
          # 1. Embed Provisioning Profile
          cp "$HOME/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision" build/Payload/SmartStock.app/embedded.mobileprovision
          
          # 2. Extract Entitlements using Python XML parser
          python3 -c "
          import re, os
          prov_path = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision')
          with open(prov_path, 'rb') as f:
              content = f.read()
          match = re.search(rb'(<plist[\s\S]*?</plist>)', content)
          if match:
              os.makedirs('build', exist_ok=True)
              with open('build/profile.plist', 'wb') as out:
                  out.write(match.group(1))
              print('Extracted profile.plist successfully')
          "
          plutil -extract Entitlements xml1 -o build/entitlements.plist build/profile.plist
          
          # 3. Re-sign app bundle with Apple Distribution certificate
          codesign --force --deep --sign "Apple Distribution" \
            --entitlements build/entitlements.plist \
            --timestamp \
            build/Payload/SmartStock.app
          
          cd build
          zip -r SmartStock.ipa Payload/
          echo "IPA size: $(du -h SmartStock.ipa | cut -f1)"

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartStock-IPA
          path: build/SmartStock.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "SmartStock v1.6 (Build ${{ github.run_number }})"
          body: |
            ## SmartStock iOS IPA
            SmartStock v1.6 Release
          files: build/SmartStock.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to TestFlight
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.private_keys
          echo "$PRIVATE_KEY" > ~/.private_keys/AuthKey_${KEY_ID}.p8
          
          echo "Validating App with Apple..."
          xcrun altool --validate-app \
            -f build/SmartStock.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
            
          echo "Uploading App to TestFlight..."
          xcrun altool --upload-app \
            -f build/SmartStock.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
