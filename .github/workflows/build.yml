name: Build SmartStock iOS IPA & TestFlight Deploy

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Deploy SmartStock to TestFlight
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        id: cache-homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
            /opt/homebrew/bin/xcodegen
          key: ${{ runner.os }}-homebrew-xcodegen

      - name: Install XcodeGen
        if: steps.cache-homebrew.outputs.cache-hit != 'true'
        run: |
          brew update
          brew install xcodegen

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install Apple WWDR Intermediate Certificates
        run: |
          for cert in AppleWWDRCAG3.cer AppleWWDRCAG4.cer AppleWWDRCAG5.cer AppleWWDRCAG6.cer AppleIncRootCertificate.cer; do
            curl -fsSL "https://www.apple.com/certificateauthority/$cert" -o "/tmp/$cert" || true
            sudo security add-certificates -k /Library/Keychains/System.keychain "/tmp/$cert" || true
          done

      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_KEY_ID || secrets.KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_ISSUER_ID || secrets.ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 || secrets.APPSTORE_PRIVATE_KEY || secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.P8_BASE64 }}
        run: |
          KEY_ID=$(echo "$KEY_ID" | tr -d '\r\n ')
          ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '\r\n ')

          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$API_KEY_B64" ]; then
            echo "::error::Не все секреты заданы! KEY_ID='$KEY_ID', ISSUER_ID='$ISSUER_ID'"
            exit 1
          fi

          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${KEY_ID}.p8"

          # Проверяем, закодирован ли ключ в base64 или уже является PEM
          if echo "$API_KEY_B64" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$API_KEY_B64" > "$KEY_PATH"
          else
            echo "$API_KEY_B64" | tr -d '\r\n ' | base64 --decode | tr -d '\r' > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"

          mkdir -p "$HOME/.private_keys"
          cp "$KEY_PATH" "$HOME/.private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${KEY_ID}.p8"

          echo "APPSTORE_KEY_ID=$KEY_ID" >> $GITHUB_ENV
          echo "APPSTORE_ISSUER_ID=$ISSUER_ID" >> $GITHUB_ENV
          echo "AUTH_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV
          echo "✅ API Ключ развёрнут: $KEY_PATH"

      - name: Setup Keychain for Xcode
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KP="SmartStockSigningKeyChain2026"

          security create-keychain -p "$KP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KP" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "✅ Временный Keychain настроен"

      - name: Update Build Number
        run: |
          BUILD_NUM="${{ github.run_number }}"
          echo "Setting Build Number (CFBundleVersion) to $BUILD_NUM"
          python3 -c "
          import re
          for filepath in ['Sources/Info.plist', 'project.yml']:
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              content = re.sub(r'(<key>CFBundleVersion</key>\s*<string>)[^<]+(</string>)', r'\g<1>' + '$BUILD_NUM' + r'\g<2>', content)
              content = re.sub(r'(CFBundleVersion:\s*\")[^\"]+(\")', r'\g<1>' + '$BUILD_NUM' + r'\g<2>', content)
              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(content)
          "

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive Project
        run: |
          set -o pipefail
          echo "=== Starting xcodebuild archive ==="

          xcodebuild archive \
            -project SmartStock.xcodeproj \
            -scheme SmartStock \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/SmartStock.xcarchive" \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" \
            DEVELOPMENT_TEAM="V7J345DY58" \
            SWIFT_OPTIMIZATION_LEVEL="-O" \
            SKIP_INSTALL="NO" \
            INSTALL_PATH="/Applications" \
            2>&1 | tee build_archive.log

          if [ ! -d "$RUNNER_TEMP/SmartStock.xcarchive" ]; then
            echo "::error::Архивация не удалась!"
            exit 1
          fi
          echo "=== Archive успешно создан ==="

      - name: Auto Setup Certificates & Profiles
        run: python3 .github/scripts/auto_cert_setup.py

      - name: Create ExportOptions.plist
        run: |
          set -o pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>V7J345DY58</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>iPhone Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.samvel.smartstock.SmartStock</key>
              <string>${MAIN_APP_PROFILE_UUID}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST_EOF
          echo "✅ ExportOptions.plist успешно сформирован"

      - name: Export & Sign IPA
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/Export"
          mkdir -p build

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SmartStock.xcarchive" \
            -exportPath "$RUNNER_TEMP/Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -allowProvisioningUpdates \
            2>&1 | tee "$RUNNER_TEMP/export.log"

          IPA=$(find "$RUNNER_TEMP/Export" -name "*.ipa" | head -1)
          if [ -z "$IPA" ] || [ ! -f "$IPA" ]; then
            echo "::error::Не найден подписанный IPA файл после экспорта!"
            tail -50 "$RUNNER_TEMP/export.log"
            exit 1
          fi

          cp "$IPA" build/SmartStock.ipa
          echo "✅ Подписанный IPA сформирован: $(ls -lh build/SmartStock.ipa)"
          echo "Размер: $(du -h build/SmartStock.ipa | cut -f1)"

      - name: Upload to TestFlight
        run: |
          echo "🚀 Отправка сборки SmartStock в TestFlight..."
          xcrun altool --upload-app \
            -f build/SmartStock.ipa \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --verbose

          echo "✅ Сборка SmartStock успешно выгружена в TestFlight!"

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartStock-IPA-${{ github.run_number }}
          path: build/SmartStock.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "SmartStock v1.7 (Build ${{ github.run_number }})"
          body: |
            ## 🚀 SmartStock v1.7 (Build ${{ github.run_number }})
            - Автоматическая сборка, подпись Apple Distribution и отправка в App Store Connect / TestFlight.
            - Потокобезопасная обработка очереди и импорта файлов по стандартам Swift 6 Strict Concurrency.
          files: build/SmartStock.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
