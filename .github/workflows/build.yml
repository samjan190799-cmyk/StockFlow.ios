name: Build SmartStock iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SmartStock iOS Application
    runs-on: macos-15

    env:
      HAS_SIGNING: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' && 'true' || 'false' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        id: cache-homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
            /opt/homebrew/bin/xcodegen
          key: ${{ runner.os }}-homebrew-xcodegen

      - name: Install XcodeGen
        if: steps.cache-homebrew.outputs.cache-hit != 'true'
        run: |
          brew update
          brew install xcodegen

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install Apple WWDR Intermediate Certificates
        run: |
          for cert in AppleWWDRCAG3.cer AppleWWDRCAG4.cer AppleWWDRCAG5.cer AppleWWDRCAG6.cer AppleIncRootCertificate.cer; do
            curl -fsSL "https://www.apple.com/certificateauthority/$cert" -o "/tmp/$cert" || true
            sudo security add-certificates -k /Library/Keychains/System.keychain "/tmp/$cert" || true
          done

      - name: Import Code Signing Certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROFILE_B64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          python3 -c "
          import os, base64, re
          raw_b64 = os.environ.get('PROFILE_B64', '')
          b64 = re.sub(r'[^A-Za-z0-9+/=]', '', raw_b64)
          if not b64:
              raise ValueError('BUILD_PROVISION_PROFILE_BASE64 is empty!')
          b64 += '=' * ((4 - len(b64) % 4) % 4)
          data = base64.b64decode(b64)
          dest = os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision')
          os.makedirs(os.path.dirname(dest), exist_ok=True)
          with open(dest, 'wb') as f:
              f.write(data)
          print('Installed provisioning profile, size:', len(data), 'bytes')
          "
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Update Build Number
        run: |
          BUILD_NUM="${{ github.run_number }}"
          echo "Setting Build Number (CFBundleVersion) to $BUILD_NUM"
          python3 -c "
          import re
          for filepath in ['Sources/Info.plist', 'project.yml']:
              with open(filepath, 'r', encoding='utf-8') as f:
                  content = f.read()
              content = re.sub(r'(<key>CFBundleVersion</key>\s*<string>)[^<]+(</string>)', r'\g<1>' + '$BUILD_NUM' + r'\g<2>', content)
              content = re.sub(r'(CFBundleVersion:\s*\")[^\"]+(\")', r'\g<1>' + '$BUILD_NUM' + r'\g<2>', content)
              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(content)
          "

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Diagnose Signing Environment
        run: |
          echo "=== Certificate Details (OpenSSL) ==="
          security find-certificate -a -c "Apple Distribution" -p | openssl x509 -noout -dates -subject -issuer 2>/dev/null || echo "Could not parse cert"

          echo "=== Provisioning Profile Details ==="
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision" 2>/dev/null \
            | grep -A 1 -E "(UUID|Name|TeamIdentifier|ExpirationDate|application-identifier)" \
            | head -30 || echo "Could not read profile"

          echo "=== All code signing identities ==="
          security find-identity -v -p codesigning 2>/dev/null || echo "No certificates found"

      - name: Archive App
        shell: bash
        run: |
          set -o pipefail
          echo "=== Starting xcodebuild archive ==="

          xcodebuild archive \
            -project SmartStock.xcodeproj \
            -scheme SmartStock \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/SmartStock.xcarchive \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" \
            DEVELOPMENT_TEAM="V7J345DY58" \
            SWIFT_OPTIMIZATION_LEVEL="-O" \
            SKIP_INSTALL="NO" \
            INSTALL_PATH="/Applications" \
            2>&1 | tee build_archive.log

          if [ ! -d "build/SmartStock.xcarchive" ]; then
            echo "::error::Архивация не удалась!"
            exit 1
          fi
          echo "=== Archive успешно создан ==="

      - name: Export IPA
        shell: bash
        run: |
          set +e
          echo "=== Attempting xcodebuild -exportArchive ==="
          xcodebuild -exportArchive \
            -archivePath build/SmartStock.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            2>&1 | tee export.log

          IPA_PATH=$(find build/export -name "*.ipa" 2>/dev/null | head -1)

          if [ -n "$IPA_PATH" ] && [ -f "$IPA_PATH" ]; then
            echo "ExportArchive successful: $IPA_PATH"
            cp "$IPA_PATH" build/SmartStock.ipa
          else
            echo "ExportArchive failed or skipped. Packaging IPA directly from xcarchive Payload..."
            APP_PATH=$(find build/SmartStock.xcarchive/Products/Applications -name "*.app" | head -1)
            if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
              echo "::error::Не найден .app внутри xcarchive!"
              exit 1
            fi
            echo "Found .app at: $APP_PATH"
            mkdir -p build/Payload
            cp -r "$APP_PATH" build/Payload/SmartStock.app
            cd build
            zip -r -q SmartStock.ipa Payload/
            cd ..
          fi

          echo "IPA ready: $(ls -lh build/SmartStock.ipa)"
          echo "IPA size: $(du -h build/SmartStock.ipa | cut -f1)"

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartStock-IPA
          path: build/SmartStock.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "SmartStock v1.7 (Build ${{ github.run_number }})"
          body: |
            ## 🚀 SmartStock v1.7

            ### 🔴 Исправления
            - **Краш при смене языка интерфейса** — исправлен deprecated `onChange` синтаксис (Swift 6 / iOS 17+)
            - **Google Photos: пропуски файлов** — добавлено обновление протухших `baseUrl` (Google ограничивает 60 мин)
            - **Расход памяти** — установлен лимит кеша миниатюр Google Photos (500 шт / 100 МБ)

            ### ✨ Улучшения
            - Google Photos список больше не перезагружается при каждом открытии пикера
            - Добавлена кнопка «↻ Обновить» список Google Photos
            - Параллельная загрузка миниатюр ограничена до 8 потоков (плавный скролл)
            - Поддержка до 20 000 файлов в Google Photos (было 5 000)
            - Правильные расширения видео из Google Photos (.mov, .heic, .dng и др.)
            - Убрана кнопка «Галерея» в верхнем левом углу главного экрана
          files: build/SmartStock.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to TestFlight
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "App Store Connect API keys not fully configured. Skipping TestFlight upload."
            exit 0
          fi

          mkdir -p ~/.private_keys
          echo "$PRIVATE_KEY" > ~/.private_keys/AuthKey_${KEY_ID}.p8

          echo "Uploading App to TestFlight via xcrun altool..."
          xcrun altool --upload-app \
            -f build/SmartStock.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose || echo "TestFlight upload finished with status: $?"
