name: ASC build status (только чтение)

# Показывает, как Apple обработала последние сборки SmartStock.
# Делает исключительно GET-запросы, ничего не собирает, не подписывает и не загружает.
# Запускается вручную, а также при изменении этого файла или скрипта на ветках claude/**
# (GitHub не позволяет запускать вручную новый workflow, которого ещё нет в main).
on:
  workflow_dispatch:
  push:
    branches: [ "claude/**" ]
    paths:
      - ".github/workflows/asc-status.yml"
      - ".github/scripts/asc_build_status.py"
      - ".github/scripts/asc_submission_status.py"

permissions:
  contents: read

jobs:
  status:
    name: Состояние сборок в App Store Connect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_KEY_ID || secrets.KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_ISSUER_ID || secrets.ISSUER_ID }}
          API_KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 || secrets.APPSTORE_PRIVATE_KEY || secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.P8_BASE64 }}
        run: |
          KEY_ID=$(echo "$KEY_ID" | tr -d '\r\n ')
          ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '\r\n ')

          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$API_KEY_B64" ]; then
            echo "::error::Не все секреты заданы!"
            exit 1
          fi

          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          if echo "$API_KEY_B64" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$API_KEY_B64" > "$KEY_PATH"
          else
            echo "$API_KEY_B64" | tr -d '\r\n ' | base64 --decode | tr -d '\r' > "$KEY_PATH"
          fi
          chmod 600 "$KEY_PATH"

          echo "APPSTORE_KEY_ID=$KEY_ID" >> $GITHUB_ENV
          echo "APPSTORE_ISSUER_ID=$ISSUER_ID" >> $GITHUB_ENV
          echo "AUTH_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV

      - name: Query build status
        run: python3 .github/scripts/asc_build_status.py

      - name: Query submission status
        run: python3 .github/scripts/asc_submission_status.py
